<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026/12/11~12/13 桃竹苗 1帳包區・開闊景觀✕極淨衛浴露營推薦</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f8;
      color: #333;
    }
    #sidebar {
      width: 470px;
      min-width: 470px;
      height: 100%;
      background: #ffffff;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: transform 0.3s ease;
    }
    .header {
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, #1b4d3e 0%, #2e7d32 100%);
      color: white;
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 0.78rem;
      margin-top: 4px;
      opacity: 0.92;
      line-height: 1.4;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .header-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      color: white;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }
    .header-btn.btn-export {
      background: #f59e0b;
      border-color: #d97706;
      color: #1a1a1a;
      font-weight: 700;
    }
    .header-btn.btn-export:hover {
      background: #fbbf24;
    }

    .filter-bar {
      padding: 8px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 4px 9px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 500;
      border: 1px solid #cbd5e1;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-btn:hover {
      background: #e2e8f0;
    }
    .filter-btn.active {
      background: #1b4d3e;
      color: white;
      border-color: #1b4d3e;
    }

    #camp-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 0.85rem;
    }
    .empty-state i {
      font-size: 2rem;
      color: #94a3b8;
      margin-bottom: 10px;
      display: block;
    }

    .camp-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .camp-card:hover {
      border-color: #2e7d32;
      box-shadow: 0 4px 14px rgba(46,125,50,0.14);
      transform: translateY(-2px);
    }
    .camp-card.active {
      border-color: #2e7d32;
      border-left: 5px solid #2e7d32;
      background: #fbfdfb;
    }

    /* Card Status Styles */
    .camp-card.status-favorite {
      border: 2px solid #f59e0b;
      background: #fffdf5;
    }
    .camp-card.status-considering {
      border: 2px solid #38bdf8;
      background: #f8fafc;
    }
    .camp-card.status-rejected {
      opacity: 0.55;
      background: #f9f9f9;
      border-color: #cbd5e1;
    }
    .camp-card.status-rejected:hover {
      opacity: 0.92;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1b4d3e;
    }
    .user-status-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .badge-fav { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
    .badge-consider { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-reject { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    .badge-alt {
      background: #e8f5e9;
      color: #1b4d3e;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }
    .tag-hotwater { background: #ffebee; color: #c62828; }
    .tag-dispenser { background: #e3f2fd; color: #1565c0; }
    .tag-setup { background: #ede7f6; color: #4527a0; }
    .tag-view { background: #fff8e1; color: #f57f17; }
    .tag-easycamp { background: #e0f2f1; color: #00695c; }

    .card-info {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-info i {
      width: 16px;
      color: #2e7d32;
    }
    .callout-box {
      margin-top: 8px;
      padding: 8px 10px;
      background: #fffde7;
      border-left: 3px solid #fbc02d;
      border-radius: 4px;
      font-size: 0.73rem;
      color: #614a00;
      line-height: 1.4;
    }

    /* User Review Box */
    .user-review-box {
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px 10px;
      transition: all 0.2s;
    }
    .user-review-box:focus-within {
      border-color: #2e7d32;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(46,125,50,0.12);
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .review-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-pills {
      display: flex;
      gap: 3px;
    }
    .status-pill {
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #475569;
    }
    .status-pill:hover {
      background: #f1f5f9;
    }
    .status-pill.active[data-status="none"] {
      background: #f1f5f9;
      border-color: #94a3b8;
      font-weight: bold;
    }
    .status-pill.active[data-status="favorite"] {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
      font-weight: bold;
    }
    .status-pill.active[data-status="considering"] {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      font-weight: bold;
    }
    .status-pill.active[data-status="rejected"] {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
      font-weight: bold;
    }

    .review-textarea {
      width: 100%;
      min-height: 58px;
      max-height: 180px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.76rem;
      line-height: 1.45;
      font-family: inherit;
      resize: vertical;
      outline: none;
      background: white;
      color: #1e293b;
      transition: border-color 0.2s;
    }
    .review-textarea:focus {
      border-color: #2e7d32;
    }

    .review-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }
    .save-indicator {
      font-size: 0.68rem;
      color: #16a34a;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 500;
    }
    .save-indicator.saving {
      color: #d97706;
    }
    .review-footer-btns {
      display: flex;
      gap: 5px;
    }
    .btn-note-action {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: white;
      transition: all 0.2s;
    }
    .btn-save-quick {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }
    .btn-save-quick:hover {
      background: #dcfce7;
    }
    .btn-clear-quick {
      color: #94a3b8;
    }
    .btn-clear-quick:hover {
      color: #ef4444;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .card-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
    }
    .btn-locate {
      background: #e8f5e9;
      color: #1b4d3e;
      border: 1px solid #c8e6c9;
    }
    .btn-locate:hover { background: #c8e6c9; }
    .btn-book {
      background: #1b4d3e;
      color: white;
      border: 1px solid #1b4d3e;
    }
    .btn-book:hover { background: #2e7d32; }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .map-toggle-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: white;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .map-toggle-btn:hover { background: #f8fafc; }

    /* Custom Leaflet Marker Pins */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      border: 2px solid white;
    }
    .marker-hot { background-color: #d32f2f; }
    .marker-std { background-color: #2e7d32; }

    /* Custom Popup Style */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    .popup-container {
      padding: 6px 4px;
      min-width: 260px;
      font-family: 'Noto Sans TC', sans-serif;
    }
    .popup-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1b4d3e;
      margin-bottom: 6px;
    }
    .popup-row {
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #444;
      line-height: 1.4;
    }
    .popup-row i {
      width: 16px;
      color: #2e7d32;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 48, 38, 0.95);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 99999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Modal for Backup / Restore */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1b4d3e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-desc {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .modal-textarea {
      width: 100%;
      height: 130px;
      font-family: monospace;
      font-size: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      outline: none;
      margin-bottom: 12px;
    }
    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-cancel {
      border: 1px solid #cbd5e1;
      background: white;
      color: #475569;
    }
    .modal-btn-primary {
      border: none;
      background: #1b4d3e;
      color: white;
    }

    @media (max-width: 860px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; min-width: 100%; height: 55%; }
      #map-container { height: 45%; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1><i class="fa-solid fa-mountain-sun"></i> 2026/12/11~12/13 露營精選</h1>
      <p>專屬推薦：真・1帳包區 ✕ 開闊山嵐雲海 ✕ 乾淨如飯店衛浴（12/11週五正常營業）</p>
      <div class="header-actions">
        <button class="header-btn btn-export" onclick="copyAllReviewSummary()">
          <i class="fa-solid fa-clipboard-check"></i> 一鍵複製所有筆記摘要
        </button>
        <button class="header-btn" onclick="toggleBackupModal()">
          <i class="fa-solid fa-file-export"></i> 筆記備份/還原
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" id="filter-btn-all" onclick="filterCamps('all')">全部營地 (10)</button>
      <button class="filter-btn" id="filter-btn-favorite" onclick="filterCamps('favorite')">🌟 首選 (<span id="count-fav">0</span>)</button>
      <button class="filter-btn" id="filter-btn-hasnotes" onclick="filterCamps('hasnotes')">📝 有筆記 (<span id="count-notes">0</span>)</button>
      <button class="filter-btn" id="filter-btn-hotwater" onclick="filterCamps('hotwater')">🔥水槽溫熱水 (2)</button>
      <button class="filter-btn" id="filter-btn-dispenser" onclick="filterCamps('dispenser')">💧有飲水機 (9)</button>
      <button class="filter-btn" id="filter-btn-highalt" onclick="filterCamps('highalt')">🏔️800m+大景 (8)</button>
    </div>

    <div id="camp-list"></div>
  </div>

  <div id="map-container">
    <button class="map-toggle-btn" onclick="toggleLayer()">
      <i class="fa-solid fa-layer-group"></i> 切換衛星空照圖
    </button>
    <div id="map"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"><i class="fa-solid fa-circle-check"></i> <span id="toast-text">已自動儲存筆記</span></div>

  <!-- Backup & Restore Modal -->
  <div class="modal-overlay" id="backup-modal" onclick="if(event.target === this) toggleBackupModal()">
    <div class="modal-content">
      <div class="modal-title">
        <span><i class="fa-solid fa-floppy-disk"></i> 評估筆記資料備份與還原</span>
        <button onclick="toggleBackupModal()" style="border:none; background:none; font-size:1.1rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-desc">
        您輸入的所有心得備註與評估狀態均儲存在您的瀏覽器本機端中（重整或關閉分頁不遺失）。您也可以在此複製 JSON 備份或貼上還原：
      </div>
      <textarea class="modal-textarea" id="backup-json-textarea"></textarea>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" onclick="toggleBackupModal()">關閉</button>
        <button class="modal-btn modal-btn-primary" onclick="restoreFromModalJson()">匯入還原筆記</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->

    // LocalStorage Reviews Management
    const STORAGE_KEY = 'camping_user_reviews_v1';
    
    function getReviews() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {};
      } catch (e) {
        console.error('Failed to parse localStorage', e);
        return {};
      }
    }

    function saveAllReviews(reviews) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
        updateFilterCounts();
      } catch (e) {
        console.error('Failed to save to localStorage', e);
      }
    }

    function getCampReview(id) {
      const reviews = getReviews();
      return reviews[id] || { status: 'none', notes: '', updatedAt: '' };
    }

    function setCampStatus(id, newStatus) {
      const reviews = getReviews();
      if (!reviews[id]) reviews[id] = { status: 'none', notes: '', updatedAt: '' };
      reviews[id].status = newStatus;
      reviews[id].updatedAt = getFormattedCurrentTime();
      saveAllReviews(reviews);

      // Re-render current camp card status visually without losing text focus
      applyCardVisualState(id, newStatus);
      showSaveIndicator(id, `已儲存狀態`);
      showToast(`已更新 #${id < 10 ? '0' + id : id} 評估狀態為：${getStatusLabel(newStatus)}`);
    }

    function saveCampNote(id, showToastMsg = false) {
      const textarea = document.getElementById(`note-${id}`);
      if (!textarea) return;

      const notes = textarea.value;
      const reviews = getReviews();
      if (!reviews[id]) reviews[id] = { status: 'none', notes: '', updatedAt: '' };
      
      reviews[id].notes = notes;
      reviews[id].updatedAt = getFormattedCurrentTime();
      saveAllReviews(reviews);

      showSaveIndicator(id, `已自動儲存 (${reviews[id].updatedAt})`);
      if (showToastMsg) {
        showToast(`已儲存 #${id < 10 ? '0' + id : id} 備註！`);
      }
    }

    const inputDebounceTimers = {};
    function onNoteInput(id) {
      const indicator = document.getElementById(`save-indicator-${id}`);
      if (indicator) {
        indicator.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...`;
        indicator.className = 'save-indicator saving';
      }

      clearTimeout(inputDebounceTimers[id]);
      inputDebounceTimers[id] = setTimeout(() => {
        saveCampNote(id);
      }, 500);
    }

    function clearCampNote(id) {
      const textarea = document.getElementById(`note-${id}`);
      if (!textarea) return;
      if (textarea.value.trim() && !confirm('確定要清空此露營區的心得備註嗎？')) return;

      textarea.value = '';
      const reviews = getReviews();
      if (reviews[id]) {
        reviews[id].notes = '';
        reviews[id].updatedAt = getFormattedCurrentTime();
        saveAllReviews(reviews);
      }
      showSaveIndicator(id, `已清空備註`);
      showToast(`已清空 #${id < 10 ? '0' + id : id} 備註`);
    }

    function showSaveIndicator(id, text) {
      const indicator = document.getElementById(`save-indicator-${id}`);
      if (indicator) {
        indicator.innerHTML = `<i class="fa-solid fa-check"></i> ${text}`;
        indicator.className = 'save-indicator';
      }
    }

    function applyCardVisualState(id, status) {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      card.classList.remove('status-favorite', 'status-considering', 'status-rejected');
      if (status === 'favorite') card.classList.add('status-favorite');
      else if (status === 'considering') card.classList.add('status-considering');
      else if (status === 'rejected') card.classList.add('status-rejected');

      // Update active pill button
      const pills = card.querySelectorAll('.status-pill');
      pills.forEach(pill => {
        if (pill.getAttribute('data-status') === status) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });

      // Update badge in card title
      const badgeContainer = document.getElementById(`status-badge-${id}`);
      if (badgeContainer) {
        if (status === 'favorite') {
          badgeContainer.innerHTML = `<span class="user-status-badge badge-fav"><i class="fa-solid fa-star"></i> 首選考慮</span>`;
        } else if (status === 'considering') {
          badgeContainer.innerHTML = `<span class="user-status-badge badge-consider"><i class="fa-solid fa-clock"></i> 考慮中</span>`;
        } else if (status === 'rejected') {
          badgeContainer.innerHTML = `<span class="user-status-badge badge-reject"><i class="fa-solid fa-xmark"></i> 已淘汰</span>`;
        } else {
          badgeContainer.innerHTML = ``;
        }
      }
    }

    function getStatusLabel(status) {
      switch (status) {
        case 'favorite': return '🌟 首選考慮';
        case 'considering': return '🤔 考慮中';
        case 'rejected': return '❌ 淘汰排除';
        default: return '⚪ 未設定';
      }
    }

    function getFormattedCurrentTime() {
      const now = new Date();
      return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    function updateFilterCounts() {
      const reviews = getReviews();
      let favCount = 0;
      let notesCount = 0;

      camps.forEach(camp => {
        const rev = reviews[camp.id];
        if (rev) {
          if (rev.status === 'favorite') favCount++;
          if (rev.notes && rev.notes.trim().length > 0) notesCount++;
        }
      });

      const favEl = document.getElementById('count-fav');
      const notesEl = document.getElementById('count-notes');
      if (favEl) favEl.textContent = favCount;
      if (notesEl) notesEl.textContent = notesCount;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Export / Copy All Notes
    function copyAllReviewSummary() {
      const reviews = getReviews();
      const campsWithReview = camps.filter(camp => {
        const r = reviews[camp.id];
        return r && (r.status !== 'none' || (r.notes && r.notes.trim().length > 0));
      });

      if (campsWithReview.length === 0) {
        showToast('目前尚未填寫筆記或標記狀態！請先在營地卡片內輸入心得。');
        return;
      }

      let summary = `🏕️【2026/12/11~12/13 桃竹苗露營評估心得與決選筆記】\n`;
      summary += `產生時間：${new Date().toLocaleString('zh-TW')}\n`;
      summary += `--------------------------------------------------\n\n`;

      const favorites = camps.filter(c => reviews[c.id]?.status === 'favorite');
      const considerings = camps.filter(c => reviews[c.id]?.status === 'considering');
      const rejecteds = camps.filter(c => reviews[c.id]?.status === 'rejected');
      const othersWithNotes = camps.filter(c => (reviews[c.id]?.status === 'none' || !reviews[c.id]?.status) && reviews[c.id]?.notes?.trim());

      if (favorites.length > 0) {
        summary += `🌟【我的首選營地 (${favorites.length}處)】\n`;
        favorites.forEach(c => {
          const rev = reviews[c.id];
          summary += `• #${c.id < 10 ? '0' + c.id : c.id} ${c.name} (${c.altitude})\n`;
          summary += `  - 包區營位：${c.single_zone_type}\n`;
          summary += `  - 設施特色：${c.sink_hot_water ? '🔥水槽有熱水' : '水槽無熱水'} / ${c.water_dispenser ? '💧有飲水機' : '無飲水機'}\n`;
          if (rev.notes?.trim()) summary += `  - 我的筆記：${rev.notes.trim()}\n`;
          summary += `  - 訂位連結：${c.booking_url}\n\n`;
        });
      }

      if (considerings.length > 0) {
        summary += `🤔【考慮中營地 (${considerings.length}處)】\n`;
        considerings.forEach(c => {
          const rev = reviews[c.id];
          summary += `• #${c.id < 10 ? '0' + c.id : c.id} ${c.name} (${c.altitude})\n`;
          if (rev.notes?.trim()) summary += `  - 我的筆記：${rev.notes.trim()}\n`;
          summary += `  - 訂位連結：${c.booking_url}\n\n`;
        });
      }

      if (rejecteds.length > 0) {
        summary += `❌【已淘汰/排除營地 (${rejecteds.length}處)】\n`;
        rejecteds.forEach(c => {
          const rev = reviews[c.id];
          summary += `• #${c.id < 10 ? '0' + c.id : c.id} ${c.name}`;
          if (rev.notes?.trim()) summary += ` (原因：${rev.notes.trim()})`;
          summary += `\n`;
        });
        summary += `\n`;
      }

      if (othersWithNotes.length > 0) {
        summary += `📝【其他備註】\n`;
        othersWithNotes.forEach(c => {
          const rev = reviews[c.id];
          summary += `• #${c.id < 10 ? '0' + c.id : c.id} ${c.name}：${rev.notes.trim()}\n`;
        });
        summary += `\n`;
      }

      summary += `--------------------------------------------------\n`;
      summary += `(可直接貼在對話框分享給 Antigravity 或朋友討論)`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(summary).then(() => {
          showToast('🎉 已複製所有評估備註！可直接貼在對話中！');
        }).catch(() => {
          fallbackCopyText(summary);
        });
      } else {
        fallbackCopyText(summary);
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('🎉 已複製所有評估備註！可直接貼在對話中！');
    }

    // Modal Backup & Restore
    function toggleBackupModal() {
      const modal = document.getElementById('backup-modal');
      const textarea = document.getElementById('backup-json-textarea');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
      } else {
        textarea.value = JSON.stringify(getReviews(), null, 2);
        modal.classList.add('active');
      }
    }

    function restoreFromModalJson() {
      const textarea = document.getElementById('backup-json-textarea');
      try {
        const parsed = JSON.parse(textarea.value);
        saveAllReviews(parsed);
        renderCampList(currentFilter);
        toggleBackupModal();
        showToast('✅ 筆記資料已成功匯入還原！');
      } catch (e) {
        alert('JSON 格式錯誤，請檢查後再試！');
      }
    }

    // Initialize Map with Google Standard Roadmap
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps Satellite'
    });

    const map = L.map('map', {
      center: [24.58, 121.16], zoom: 10,
      layers: [googleRoadmap]
    });

    let currentLayer = 'roadmap';
    function toggleLayer() {
      if (currentLayer === 'roadmap') {
        map.removeLayer(googleRoadmap);
        map.addLayer(googleSatellite);
        currentLayer = 'satellite';
      } else {
        map.removeLayer(googleSatellite);
        map.addLayer(googleRoadmap);
        currentLayer = 'roadmap';
      }
    }

    const markers = {};
    let currentFilter = 'all';

    function renderCampList(filter = 'all') {
      currentFilter = filter;
      const listContainer = document.getElementById('camp-list');
      listContainer.innerHTML = '';
      const reviews = getReviews();

      let matchedCount = 0;

      camps.forEach(camp => {
        const rev = reviews[camp.id] || { status: 'none', notes: '', updatedAt: '' };

        if (filter === 'favorite' && rev.status !== 'favorite') return;
        if (filter === 'hasnotes' && (!rev.notes || rev.notes.trim().length === 0)) return;
        if (filter === 'hotwater' && !camp.sink_hot_water) return;
        if (filter === 'dispenser' && !camp.water_dispenser) return;
        if (filter === 'highalt') {
          const altNum = parseInt(camp.altitude.replace(/[^0-9]/g, ''));
          if (altNum < 800) return;
        }

        matchedCount++;

        const card = document.createElement('div');
        let statusClass = '';
        if (rev.status === 'favorite') statusClass = 'status-favorite';
        else if (rev.status === 'considering') statusClass = 'status-considering';
        else if (rev.status === 'rejected') statusClass = 'status-rejected';

        card.className = `camp-card ${statusClass}`;
        card.id = `card-${camp.id}`;
        card.onclick = () => focusCamp(camp.id);

        let specialNoteHtml = '';
        if (camp.special_notes) {
          specialNoteHtml = `<div class="callout-box"><i class="fa-solid fa-circle-exclamation"></i> ${camp.special_notes}</div>`;
        }

        const idFormatted = camp.id < 10 ? '0' + camp.id : camp.id;

        let statusBadgeHtml = '';
        if (rev.status === 'favorite') {
          statusBadgeHtml = `<span class="user-status-badge badge-fav"><i class="fa-solid fa-star"></i> 首選考慮</span>`;
        } else if (rev.status === 'considering') {
          statusBadgeHtml = `<span class="user-status-badge badge-consider"><i class="fa-solid fa-clock"></i> 考慮中</span>`;
        } else if (rev.status === 'rejected') {
          statusBadgeHtml = `<span class="user-status-badge badge-reject"><i class="fa-solid fa-xmark"></i> 已淘汰</span>`;
        }

        const escapedNotes = rev.notes ? rev.notes.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title-group">
              <span class="card-title">#${idFormatted} ${camp.name}</span>
              <span id="status-badge-${camp.id}">${statusBadgeHtml}</span>
            </div>
            <span class="badge-alt">${camp.altitude}</span>
          </div>
          <div class="tags">
            ${camp.sink_hot_water ? '<span class="tag tag-hotwater"><i class="fa-solid fa-fire"></i> 水槽溫熱水</span>' : ''}
            ${camp.water_dispenser ? '<span class="tag tag-dispenser"><i class="fa-solid fa-droplet"></i> 飲水機</span>' : ''}
            <span class="tag tag-easycamp"><i class="fa-solid fa-campground"></i> 真・1帳包區</span>
            <span class="tag tag-view"><i class="fa-solid fa-mountain"></i> 開闊視野</span>
            <span class="tag tag-setup"><i class="fa-solid fa-bath"></i> 極淨衛浴</span>
          </div>
          <div class="card-info">
            <div><i class="fa-solid fa-location-dot"></i> <strong>位置：</strong>${camp.region} (${camp.corridor})</div>
            <div><i class="fa-solid fa-campground"></i> <strong>包區特性：</strong>${camp.single_zone_type}</div>
            <div><i class="fa-solid fa-mountain"></i> <strong>視野景觀：</strong>${camp.view_quality}</div>
            <div><i class="fa-solid fa-bath"></i> <strong>衛浴設施：</strong>${camp.bathroom}</div>
            <div><i class="fa-solid fa-circle-info"></i> <strong>熱水水電：</strong>${camp.hot_water_note}</div>
          </div>
          ${specialNoteHtml}

          <!-- User Interactive Note & Review Box -->
          <div class="user-review-box" onclick="event.stopPropagation()">
            <div class="review-header">
              <span class="review-title"><i class="fa-solid fa-pen-to-square"></i> 我的評估心得備註</span>
              <div class="status-pills">
                <button type="button" class="status-pill ${rev.status === 'none' || !rev.status ? 'active' : ''}" data-status="none" onclick="setCampStatus(${camp.id}, 'none')">⚪ 未定</button>
                <button type="button" class="status-pill ${rev.status === 'favorite' ? 'active' : ''}" data-status="favorite" onclick="setCampStatus(${camp.id}, 'favorite')">🌟 首選</button>
                <button type="button" class="status-pill ${rev.status === 'considering' ? 'active' : ''}" data-status="considering" onclick="setCampStatus(${camp.id}, 'considering')">🤔 考慮中</button>
                <button type="button" class="status-pill ${rev.status === 'rejected' ? 'active' : ''}" data-status="rejected" onclick="setCampStatus(${camp.id}, 'rejected')">❌ 淘汰</button>
              </div>
            </div>
            <textarea 
              class="review-textarea" 
              id="note-${camp.id}" 
              placeholder="點此輸入您查看後的優缺點心得、鎖定營位或疑問（會自動即時儲存至瀏覽器）..."
              oninput="onNoteInput(${camp.id})"
              onblur="saveCampNote(${camp.id})"
            >${escapedNotes}</textarea>
            <div class="review-footer">
              <span class="save-indicator" id="save-indicator-${camp.id}">
                ${rev.updatedAt ? `<i class="fa-solid fa-check"></i> 上次更新 ${rev.updatedAt}` : ''}
              </span>
              <div class="review-footer-btns">
                <button type="button" class="btn-note-action btn-save-quick" onclick="saveCampNote(${camp.id}, true)"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
                <button type="button" class="btn-note-action btn-clear-quick" onclick="clearCampNote(${camp.id})"><i class="fa-solid fa-trash-can"></i> 清除</button>
              </div>
            </div>
          </div>

          <div class="card-actions">
            <a class="btn-action btn-locate" onclick="event.stopPropagation(); focusCamp(${camp.id})"><i class="fa-solid fa-location-crosshairs"></i> 地圖定位</a>
            <a class="btn-action btn-book" href="${camp.booking_url}" target="_blank" onclick="event.stopPropagation()"><i class="fa-solid fa-arrow-up-right-from-square"></i> 線上查位/訂位</a>
          </div>
        `;
        listContainer.appendChild(card);
      });

      if (matchedCount === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-filter-circle-xmark"></i>
            <div>目前條件下沒有營地</div>
            <button class="filter-btn" style="margin:12px auto 0; padding:6px 14px;" onclick="filterCamps('all')">顯示全部 10 個營地</button>
          </div>
        `;
      }

      updateFilterCounts();
    }

    function createMarkers() {
      camps.forEach(camp => {
        const markerClass = camp.sink_hot_water ? 'marker-hot' : 'marker-std';
        const customIcon = L.divIcon({
          className: '',
          html: `<div class="custom-marker ${markerClass}">#${camp.id}</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });

        const marker = L.marker([camp.lat, camp.lng], { icon: customIcon }).addTo(map);

        let popupNote = '';
        if (camp.special_notes) {
          popupNote = `<div style="margin-top:6px; font-size:0.75rem; background:#fffde7; padding:4px 6px; border-left:3px solid #fbc02d;">${camp.special_notes}</div>`;
        }

        const popupHtml = `
          <div class="popup-container">
            <div class="popup-title">#${camp.id < 10 ? "0" + camp.id : camp.id} ${camp.name}</div>
            <div class="popup-row"><i class="fa-solid fa-mountain"></i> <strong>海拔：</strong>${camp.altitude}</div>
            <div class="popup-row"><i class="fa-solid fa-campground"></i> <strong>包區：</strong>${camp.single_zone_type}</div>
            <div class="popup-row"><i class="fa-solid fa-bath"></i> <strong>衛浴：</strong>${camp.bathroom}</div>
            <div class="popup-row"><i class="fa-solid fa-sink"></i> <strong>水槽熱水：</strong>${camp.sink_hot_water ? '🔥 有溫熱水' : '無 (衛浴有熱水)'}</div>
            <div class="popup-row"><i class="fa-solid fa-droplet"></i> <strong>飲水機：</strong>${camp.water_dispenser ? '有' : '無 (需自備水)'}</div>
            ${popupNote}
            <div style="margin-top:8px;">
              <a href="${camp.booking_url}" target="_blank" style="display:block; text-align:center; background:#1b4d3e; color:white; padding:5px 0; border-radius:4px; font-size:0.78rem; text-decoration:none;">前往官網 / 訂位連結</a>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml);
        marker.on('click', () => {
          highlightCard(camp.id);
        });

        markers[camp.id] = marker;
      });
    }

    function focusCamp(id) {
      const camp = camps.find(c => c.id === id);
      if (camp && markers[id]) {
        map.flyTo([camp.lat, camp.lng], 14, { duration: 1.2 });
        markers[id].openPopup();
        highlightCard(id);
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('.camp-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function filterCamps(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      const btn = document.getElementById(`filter-btn-${type}`);
      if (btn) btn.classList.add('active');
      renderCampList(type);
    }

    // Init
    renderCampList('all');
    createMarkers();
  </script>
</body>
</html>
