    });

    const map = L.map('map', {
      center: [24.58, 121.16], zoom: 10,
      layers: [googleRoadmap]
    });

    let currentLayer = 'roadmap';
    function toggleLayer() {
      if (currentLayer === 'roadmap') {
        map.removeLayer(googleRoadmap);
        map.addLayer(googleSatellite);
        currentLayer = 'satellite';
      } else {
        map.removeLayer(googleSatellite);
        map.addLayer(googleRoadmap);
        currentLayer = 'roadmap';
      }
    }

    const markers = {};

        function renderCampList(filter = 'all') {
      const listContainer = document.getElementById('camp-list');
      listContainer.innerHTML = '';

      camps.forEach(camp => {
        if (filter === 'hotwater' && !camp.sink_hot_water) return;
        if (filter === 'dispenser' && !camp.water_dispenser) return;
        if (filter === 'highalt') {
          const altNum = parseInt(camp.altitude.replace(/[^0-9]/g, ''));
          if (altNum < 800) return;
        }

        const card = document.createElement('div');
        card.className = `camp-card ${camp.id === 5 ? 'card-highlight' : ''}`;
        card.id = `card-${camp.id}`;
        card.onclick = () => focusCamp(camp.id);

        let specialNoteHtml = '';
        if (camp.special_notes) {
          specialNoteHtml = `<div class="callout-box"><i class="fa-solid fa-circle-exclamation"></i> ${camp.special_notes}</div>`;
        }

        const idFormatted = camp.id < 10 ? '0' + camp.id : camp.id;

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">#${idFormatted} ${camp.name}</div>
            <span class="badge-alt">${camp.altitude}</span>
          </div>
          <div class="tags">
            ${camp.sink_hot_water ? '<span class="tag tag-hotwater"><i class="fa-solid fa-fire"></i> 水槽溫熱水</span>' : ''}
            ${camp.water_dispenser ? '<span class="tag tag-dispenser"><i class="fa-solid fa-droplet"></i> 飲水機</span>' : ''}
            <span class="tag tag-easycamp"><i class="fa-solid fa-campground"></i> 真・1帳包區</span>
            <span class="tag tag-view"><i class="fa-solid fa-mountain"></i> 開闊視野</span>
            <span class="tag tag-setup"><i class="fa-solid fa-bath"></i> 極淨衛浴</span>
          </div>
          <div class="card-info">
            <div><i class="fa-solid fa-location-dot"></i> <strong>位置：</strong>${camp.region} (${camp.corridor})</div>
            <div><i class="fa-solid fa-campground"></i> <strong>包區特性：</strong>${camp.single_zone_type}</div>
            <div><i class="fa-solid fa-mountain"></i> <strong>視野景觀：</strong>${camp.view_quality}</div>
            <div><i class="fa-solid fa-bath"></i> <strong>衛浴設施：</strong>${camp.bathroom}</div>
            <div><i class="fa-solid fa-circle-info"></i> <strong>熱水水電：</strong>${camp.hot_water_note}</div>
          </div>
          ${specialNoteHtml}
          <div class="card-actions">
            <a class="btn-action btn-locate" onclick="event.stopPropagation(); focusCamp(${camp.id})"><i class="fa-solid fa-location-crosshairs"></i> 地圖定位</a>
            <a class="btn-action btn-book" href="${camp.booking_url}" target="_blank" onclick="event.stopPropagation()"><i class="fa-solid fa-arrow-up-right-from-square"></i> 線上查位/訂位</a>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function createMarkers() {
      camps.forEach(camp => {
        const markerClass = camp.sink_hot_water ? 'marker-hot' : 'marker-std';
        const customIcon = L.divIcon({
          className: '',
          html: `<div class="custom-marker ${markerClass}">#${camp.id}</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });

        const marker = L.marker([camp.lat, camp.lng], { icon: customIcon }).addTo(map);

        let popupNote = '';
        if (camp.special_notes) {
          popupNote = `<div style="margin-top:6px; font-size:0.75rem; background:#fffde7; padding:4px 6px; border-left:3px solid #fbc02d;">${camp.special_notes}</div>`;
        }

        const popupHtml = `
          <div class="popup-container">
            <div class="popup-title">#${camp.id < 10 ? "0" + camp.id : camp.id} ${camp.name}</div>
            <div class="popup-row"><i class="fa-solid fa-mountain"></i> <strong>海拔：</strong>${camp.altitude}</div>
            <div class="popup-row"><i class="fa-solid fa-campground"></i> <strong>包區：</strong>${camp.single_zone_type}</div>
            <div class="popup-row"><i class="fa-solid fa-bath"></i> <strong>衛浴：</strong>${camp.bathroom}</div>
            <div class="popup-row"><i class="fa-solid fa-sink"></i> <strong>水槽熱水：</strong>${camp.sink_hot_water ? '🔥 有溫熱水' : '無 (衛浴有熱水)'}</div>
            <div class="popup-row"><i class="fa-solid fa-droplet"></i> <strong>飲水機：</strong>${camp.water_dispenser ? '有' : '無 (需自備水)'}</div>
            ${popupNote}
            <div style="margin-top:8px;">
              <a href="${camp.booking_url}" target="_blank" style="display:block; text-align:center; background:#1b4d3e; color:white; padding:5px 0; border-radius:4px; font-size:0.78rem; text-decoration:none;">前往官網 / 訂位連結</a>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml);
        marker.on('click', () => {
          highlightCard(camp.id);
        });

        markers[camp.id] = marker;
      });
    }

    function focusCamp(id) {
      const camp = camps.find(c => c.id === id);
      if (camp && markers[id]) {
        map.flyTo([camp.lat, camp.lng], 14, { duration: 1.2 });
        markers[id].openPopup();
        highlightCard(id);
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('.camp-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function filterCamps(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCampList(type);
    }

    // Init
    renderCampList('all');
    createMarkers();
  </script>
</body>
</html>
